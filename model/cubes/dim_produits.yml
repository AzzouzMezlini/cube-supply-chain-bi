cubes:
  - name: dim_produits
    sql_table: dbt.dim_produits

    dimensions:
      - name: produit_id
        sql: produit_id
        type: number
        primary_key: true

      - name: code_produit
        sql: code_produit
        type: string

      - name: code_gtin_ean
        sql: code_gtin_ean
        type: string

      - name: nom_produit
        sql: nom_produit
        type: string

      - name: marque
        sql: marque
        type: string

      - name: categorie
        sql: categorie
        type: string

      - name: unite_mesure
        sql: unite_mesure
        type: string

      - name: devise_base
        sql: devise_base
        type: string

      - name: est_actif
        sql: est_actif
        type: boolean

      - name: prix_base
        sql: prix_base
        type: number

      - name: cout_base
        sql: cout_base
        type: number

      - name: taux_cout_possession
        sql: taux_cout_possession
        type: number

    measures:
      - name: nombre_produits
        type: count
        title: "Nombre total de références"

      - name: prix_moyen_base
        sql: prix_base
        type: avg
        title: "Prix catalogue moyen"