cubes:
  - name: routes_achat
    sql_table: dbt.dim_routes_achat
    public: false
    description: >
      Référentiel des routes d'achat : origine, destination, mode de transport,
      délais moyens et coûts logistiques associés.

    joins:
      - name: villes_origine
        sql: "{CUBE}.id_ville_origine = CAST({villes_origine.id_ville} AS TEXT)"
        relationship: many_to_one
      - name: villes_entrepot
        sql: "{CUBE}.id_ville_destination = CAST({villes_entrepot.id_ville} AS TEXT)"
        relationship: many_to_one

    dimensions:
      - name: route_id
        sql: route_id
        type: number
        primary_key: true

      - name: fournisseur_id
        sql: fournisseur_id
        type: number

      - name: id_ville_origine
        sql: id_ville_origine
        type: string

      - name: id_ville_destination
        sql: id_ville_destination
        type: string

      - name: mode_transport
        sql: mode_transport
        type: string

      - name: delai_moyen_jours
        sql: delai_moyen_jours
        type: number

      - name: delai_ecart_type_jours
        sql: delai_ecart_type_jours
        type: number

      - name: cout_expedition_forfaitaire
        sql: cout_expedition_forfaitaire
        type: number

    measures:
      - name: count
        type: count