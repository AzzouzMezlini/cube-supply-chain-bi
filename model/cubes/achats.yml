cubes:
  - name: achats
    sql_table: dbt.fct_achat
    public: false
    description: >
      Faits d'achats : lignes de commandes fournisseurs, réceptions,
      délais de livraison et coûts logistiques associés.

    joins:
      - name: fournisseurs
        sql: "{CUBE}.fournisseur_id = {fournisseurs.fournisseur_id}"
        relationship: many_to_one
      - name: produits
        sql: "{CUBE}.produit_id = {produits.produit_id}"
        relationship: many_to_one
      - name: routes_achat
        sql: "{CUBE}.route_id = {routes_achat.route_id}"
        relationship: many_to_one

    dimensions:
      - name: ligne_po_id
        sql: ligne_po_id
        type: number
        primary_key: true

      - name: fournisseur_id
        sql: fournisseur_id
        type: number

      - name: produit_id
        sql: produit_id
        type: number

      - name: route_id
        sql: route_id
        type: number

      - name: statut_commande
        sql: statut_commande
        type: string

      - name: devise_achat
        sql: devise_achat
        type: string

      - name: date_commande
        sql: date_commande
        type: time

      - name: date_reception
        sql: date_reception
        type: time

    measures:
      - name: count_po
        type: count
        description: "Nombre de lignes d'achats"

      - name: cout_achat_total
        type: sum
        sql: (quantite_commandee * cout_unitaire)

      - name: total_quantite_commandee
        type: sum
        sql: quantite_commandee

      - name: total_quantite_recue
        type: sum
        sql: quantite_recue

      - name: cout_transport_total
        type: sum
        sql: cout_transport_alloue

      - name: delai_reception_moyen
        type: avg
        sql: delai_livraison_jours