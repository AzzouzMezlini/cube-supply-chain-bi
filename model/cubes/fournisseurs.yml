cubes:
  - name: fournisseurs
    sql_table: dbt.dim_fournisseurs
    description: >
      Référentiel des fournisseurs : identification, localisation géographique
      et statut d'activité.

    joins:
      - name: villes
        sql: "{CUBE}.id_ville_fournisseur = CAST({villes.id_ville} AS TEXT)"
        relationship: many_to_one

    dimensions:
      - name: fournisseur_id
        sql: fournisseur_id
        type: number
        primary_key: true

      - name: nom_fournisseur
        sql: nom_fournisseur
        type: string

      - name: id_ville_fournisseur
        sql: id_ville_fournisseur
        type: string

      - name: pays_fournisseur
        sql: pays_fournisseur
        type: string

      - name: est_actif
        sql: est_actif
        type: boolean

    measures:
      - name: count
        type: count
        drill_members:
          - fournisseur_id
          - nom_fournisseur
          - pays_fournisseur