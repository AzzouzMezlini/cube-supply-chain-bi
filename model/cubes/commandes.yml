cubes:
  - name: commandes
    sql_table: dbt.fct_commandes

    joins:
      - name: clients
        sql: "{CUBE}.client_id = {clients.client_id}"
        relationship: many_to_one
      - name: produits
        sql: "{CUBE}.produit_id = {produits.produit_id}"
        relationship: many_to_one
      - name: canaux_vente
        sql: "{CUBE}.canal_id = {canaux_vente.canal_id}"
        relationship: many_to_one

    dimensions:
      - name: commande_id
        sql: commande_id
        type: number
        primary_key: true

      - name: client_id
        sql: client_id
        type: number

      - name: produit_id
        sql: produit_id
        type: number

      - name: canal_id
        sql: canal_id
        type: number

      - name: statut_commande
        sql: statut_commande
        type: string

      - name: est_en_retard
        sql: est_en_retard
        type: boolean

      - name: date_commande
        sql: date_commande
        type: time

      - name: date_livraison_effective
        sql: date_livraison_effective
        type: time

      - name: classe_abc
        sql: classe_abc
        type: string
        description: "Classification ABC du produit à la date de la commande"

    measures:
      - name: count
        type: count
        description: "Nombre total de lignes de commandes"

      - name: total_quantite_commandee
        type: sum
        sql: quantite_commandee

      - name: total_quantite_livree
        type: sum
        sql: quantite_livree

      - name: total_quantite_reliquat
        type: sum
        sql: quantite_reliquat

      - name: lead_time_moyen_jours
        type: avg
        sql: lead_time_total_jours

      - name: retard_moyen_jours
        type: avg
        sql: ecart_retard_livraison_jours

      - name: nb_commandes_en_retard
        type: count
        filters:
          - sql: "{CUBE}.est_en_retard = true"

      - name: taux_service
        type: number
        sql: "(1.0 - ({nb_commandes_en_retard}::numeric / NULLIF({count}, 0)))"
        format: percent
        description: "Taux de service OTIF"

      - name: taux_retard_livraison
        type: number
        sql: "1.0 * {nb_commandes_en_retard} / NULLIF({count}, 0)"
        format: percent
        description: "Taux de commandes livrées en retard (%)"