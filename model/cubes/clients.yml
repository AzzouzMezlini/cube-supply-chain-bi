cubes:
  - name: clients
    sql_table: dbt.dim_clients
    title: "Clients"
    description: "Référentiel des clients et de leurs segments géographiques"

    dimensions:
      - name: client_id
        sql: client_id
        type: number
        primary_key: true
        title: "ID Client"

      - name: nom_client
        sql: nom_client
        type: string
        title: "Nom du client"

      - name: ville_client
        sql: ville_client
        type: string
        title: "Ville"

      - name: segment_client
        sql: segment_client
        type: string
        title: "Segment commercial"

    measures:
      - name: count
        type: count
        title: "Nombre de clients"